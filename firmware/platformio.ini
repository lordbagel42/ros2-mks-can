; PlatformIO configuration for ESP32 micro-ROS MKS Servo CAN firmware
;
; Build:  pio run
; Flash:  pio run --target upload
; Monitor: pio device monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino

; micro-ROS transport selection (serial for lowest latency)
board_microros_transport = serial
board_microros_distro = humble

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/TheSpaceEgg/MKSServoCAN

monitor_speed = 921600

build_flags =
    -D MAX_MOTORS=6
    -D DEFAULT_NUM_MOTORS=2
    -D CAN_TX_GPIO=27
    -D CAN_RX_GPIO=26
    -D TELEMETRY_HZ=100
    -D UROS_BAUD=921600
    -D ENCODER_CPR=16384
    -D USE_BEST_EFFORT_QOS=1

; WiFi transport variant (higher latency, no USB cable required)
[env:esp32_wifi]
platform = espressif32
board = esp32dev
framework = arduino

board_microros_transport = wifi
board_microros_distro = humble

lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
    https://github.com/TheSpaceEgg/MKSServoCAN

monitor_speed = 921600

build_flags =
    -D MAX_MOTORS=6
    -D DEFAULT_NUM_MOTORS=2
    -D CAN_TX_GPIO=27
    -D CAN_RX_GPIO=26
    -D TELEMETRY_HZ=50
    -D UROS_BAUD=921600
    -D ENCODER_CPR=16384
    -D USE_BEST_EFFORT_QOS=1
    -D TRANSPORT_WIFI=1
    -D WIFI_SSID=\"your_ssid\"
    -D WIFI_PASS=\"your_password\"
    -D AGENT_IP=\"192.168.1.100\"
    -D AGENT_PORT=8888
